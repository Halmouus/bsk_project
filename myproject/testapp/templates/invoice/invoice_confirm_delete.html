{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Confirm Deletion" %}{% endblock %}

{% block content %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">{% trans "Confirm Deletion" %}</h6>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <p>{% trans "Are you sure you want to delete this invoice?" %}</p>
            <button type="submit" class="btn btn-danger">{% trans "Confirm" %}</button>
            <a href="{% url 'invoice-list' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
        </form>
    </div>
</div>
{% endblock %}
