{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Delete Supplier" %}{% endblock %}

{% block content %}
<h1>{% trans "Delete Supplier" %}</h1>
<p>{% trans "Are you sure you want to delete" %} "{{ supplier.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">{% trans "Confirm Deletion" %}</button>
    <a href="{% url 'supplier-list' %}" class="btn btn-secondary">{% trans "Cancel" %}</a>
</form>
{% endblock %}
