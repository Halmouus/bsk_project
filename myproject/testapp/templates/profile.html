{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Profile" %}{% endblock %}

{% block content %}

    <p><strong>{% trans "Last Name" %}:</strong> {{ user.last_name }}</p>
    <p><strong>{% trans "Email" %}:</strong> {{ user.email }}</p>
{% endblock %}
